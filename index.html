<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crônicas · Álbum de memórias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#161009;
    --bg-2:#1e1610;
    --paper:#e6d3a1;
    --paper-2:#dbc385;
    --paper-3:#c8ab6c;
    --ink:#2c2013;
    --ink-muted:#5e4d32;
    --ink-faint:#8a7650;
    --border:#8c723e;
    --accent:#8a3324;
    --accent-soft:#8a332433;
    --danger:#7a2318;
    --shadow: 0 18px 36px -16px rgba(0,0,0,.75);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 600px at 15% -10%, #2a1f14 0%, transparent 55%),
      radial-gradient(ellipse 800px 600px at 100% 10%, #201a12 0%, transparent 55%),
      repeating-linear-gradient(115deg, rgba(0,0,0,.12) 0 2px, transparent 2px 5px),
      var(--bg);
    color:var(--ink);
    font-family:'EB Garamond', serif;
    font-size:16.5px;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--accent-soft); }

  .medieval{ font-family:'MedievalSharp', cursive; }
  .stamp{ font-family:'Cinzel', serif; letter-spacing:.06em; }

  button{ font-family:inherit; cursor:pointer; }
  input, textarea, select{ font-family:inherit; }
  a{ color:inherit; }

  .parchment{
    background:
      radial-gradient(ellipse 220px 140px at 12% 15%, rgba(140,110,60,.28) 0%, transparent 70%),
      radial-gradient(ellipse 180px 160px at 90% 85%, rgba(120,90,45,.24) 0%, transparent 70%),
      radial-gradient(ellipse 160px 120px at 75% 10%, rgba(140,110,60,.16) 0%, transparent 70%),
      var(--paper);
  }
  .dogear{ position:relative; overflow:hidden; }
  .dogear::after{
    content:''; position:absolute; right:0; bottom:0; width:0; height:0;
    border-style:solid; border-width:0 0 20px 20px; border-color:transparent transparent rgba(44,32,19,.28) transparent;
  }

  .app{ max-width:1100px; margin:0 auto; padding:40px 24px 100px 64px; position:relative; z-index:1; }
  .spine{
    position:absolute; left:14px; top:0; bottom:0; width:24px;
    display:flex; flex-direction:column; gap:36px; align-items:center; padding-top:60px;
  }
  .spine span{
    width:15px; height:15px; border-radius:50%;
    background: radial-gradient(circle at 34% 30%, #d8c085, #8c723e 55%, #3a2c15 100%);
    box-shadow: inset 0 1px 1px rgba(255,255,255,.25), 0 2px 3px rgba(0,0,0,.65);
  }
  @media (max-width:640px){ .spine{ display:none; } .app{ padding-left:24px; } }

  .topbar{ display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:40px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:16px; }
  .brand-mark{
    width:50px; height:50px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #a5462f, var(--accent) 60%, #4c150c 100%);
    border:2px solid #3a2c15;
    display:flex; align-items:center; justify-content:center;
    font-size:22px; box-shadow:var(--shadow), inset 0 0 0 2px rgba(255,255,255,.08); flex-shrink:0;
  }
  .brand h1{ font-family:'MedievalSharp', cursive; font-size:34px; margin:0; font-weight:400; line-height:1; color:var(--paper); letter-spacing:.02em; }
  .brand p{ margin:5px 0 0; font-size:12.5px; color:#a08e68; font-style:italic; }

  .topbar-actions{ display:flex; gap:10px; }

  .btn{
    border:1.5px solid var(--ink); background:var(--paper); color:var(--ink);
    padding:9px 16px; border-radius:3px; font-size:13.5px; font-weight:600;
    display:inline-flex; align-items:center; gap:8px; transition:.15s ease;
    white-space:nowrap; box-shadow:2px 2px 0 #100a05; font-family:'EB Garamond',serif;
  }
  .btn:hover{ transform:translate(-1px,-1px); box-shadow:3px 3px 0 #100a05; }
  .btn:active{ transform:translate(1px,1px); box-shadow:1px 1px 0 #100a05; }
  .btn-primary{ background:var(--accent); color:var(--paper); border-color:#3a1108; }
  .btn-ghost{ background:transparent; border-color:transparent; color:#a08e68; box-shadow:none; padding:9px 11px; }
  .btn-ghost:hover{ color:var(--paper); background:rgba(230,211,161,.08); transform:none; box-shadow:none; }
  .btn-danger{ color:var(--danger); }
  .btn-sm{ padding:6px 13px; font-size:12.5px; }
  .icon-btn{
    width:32px; height:32px; border-radius:50%; border:1.5px solid var(--ink); background:var(--paper);
    display:flex; align-items:center; justify-content:center; font-size:14px; box-shadow:2px 2px 0 #100a05;
  }
  .icon-btn:hover{ transform:translate(-1px,-1px); box-shadow:3px 3px 0 #100a05; }

  .empty{
    text-align:center; padding:80px 20px; border:2px dashed var(--border); border-radius:4px;
    color:var(--ink-muted);
  }
  .empty .medieval{ font-size:30px; color:var(--ink); margin-bottom:8px; }
  .empty p{ font-size:15px; max-width:360px; margin:0 auto 22px; line-height:1.6; font-style:italic; }

  .album-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:26px 22px; }
  .album-card{
    border:1.5px solid var(--ink); border-radius:3px;
    padding:20px 18px 16px; cursor:pointer; position:relative; transition:.18s ease;
    box-shadow:var(--shadow);
  }
  .album-card:hover{ transform:translateY(-3px); }
  .seal{
    position:absolute; top:-16px; left:20px; width:38px; height:38px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--card-accent, var(--accent)) 70%, #fff 20%), var(--card-accent, var(--accent)) 55%, #1a0d08 100%);
    box-shadow: inset -3px -3px 6px rgba(0,0,0,.4), inset 2px 2px 4px rgba(255,255,255,.15), 0 3px 6px rgba(0,0,0,.5);
    display:flex; align-items:center; justify-content:center; font-size:15px;
  }
  .album-card h3{ font-family:'MedievalSharp', cursive; font-size:24px; font-weight:400; margin:14px 0 6px; line-height:1.1; color:var(--ink); }
  .album-card .desc{ font-size:13px; color:var(--ink-muted); line-height:1.5; min-height:18px; font-style:italic;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .album-meta{
    display:flex; justify-content:space-between; align-items:center; margin-top:14px;
    padding-top:12px; border-top:1px solid var(--border);
  }
  .album-count{ font-size:11px; color:var(--ink-faint); font-family:'Cinzel',serif; letter-spacing:.04em; }
  .album-count b{ color:var(--card-accent, var(--accent)); }
  .thumb-strip{ display:flex; margin-top:12px; }
  .thumb-strip img{
    width:32px; height:32px; object-fit:cover; border-radius:2px; border:2px solid var(--paper);
    margin-left:-9px; box-shadow:0 2px 5px rgba(0,0,0,.4); filter:sepia(.25);
  }
  .thumb-strip img:first-child{ margin-left:0; }

  .album-header{ display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:26px; flex-wrap:wrap; }
  .back-link{
    display:inline-flex; align-items:center; gap:6px; color:#a08e68; font-size:13.5px;
    margin-bottom:16px; background:none; border:none; padding:0; font-family:'Cinzel',serif; letter-spacing:.04em;
  }
  .back-link:hover{ color:var(--paper); }
  .album-title-row{ display:flex; align-items:center; gap:16px; }
  .album-title-row .seal{ position:static; }
  .album-header h2{ font-family:'MedievalSharp', cursive; font-size:38px; font-weight:400; margin:0; line-height:1; color:var(--paper); }
  .album-header .desc{ color:#a08e68; font-size:14px; margin-top:6px; max-width:520px; line-height:1.6; font-style:italic; }
  .album-header-actions{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

  .layout-toggle{ display:flex; gap:3px; background:#0e0a06; border:1.5px solid var(--border); padding:3px; border-radius:4px; }
  .layout-toggle button{
    border:none; background:transparent; color:#a08e68; padding:6px 11px; border-radius:2px; font-size:11.5px; font-family:'Cinzel',serif; letter-spacing:.03em;
  }
  .layout-toggle button.active{ background:var(--paper); color:var(--ink); }

  .photo-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:30px 22px; margin-top:32px; }
  .polaroid{
    padding:10px 10px 0; box-shadow:0 12px 24px -8px rgba(0,0,0,.6);
    cursor:pointer; transition:.18s ease; position:relative; border:1px solid #00000022;
  }
  .polaroid:hover{ transform:translateY(-4px); z-index:2; }
  .polaroid .frame{ width:100%; aspect-ratio:1/1; overflow:hidden; background:#111; border-radius:1px; position:relative; filter:sepia(.12) contrast(1.03); }
  .polaroid img{ width:100%; height:100%; object-fit:cover; display:block; }
  .polaroid .cap{ padding:12px 4px 16px; }
  .polaroid .mood{ font-size:15px; position:absolute; top:8px; right:8px; filter:drop-shadow(0 1px 1px rgba(0,0,0,.4)); z-index:3; }
  .polaroid .cap-text{ font-family:'MedievalSharp', cursive; font-size:17px; font-weight:400; color:var(--ink); line-height:1.25;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:22px; }
  .polaroid .cap-meta{ margin-top:6px; font-size:10px; color:#8a7650; display:flex; gap:8px; flex-wrap:wrap; font-family:'Cinzel',serif; letter-spacing:.03em; }
  .corner{ position:absolute; width:20px; height:20px; z-index:3; pointer-events:none; }
  .corner.tl{ top:0; left:0; background:linear-gradient(135deg, #4a3216 46%, transparent 47%); }
  .corner.tr{ top:0; right:0; background:linear-gradient(225deg, #4a3216 46%, transparent 47%); }

  .diary{ margin-top:32px; display:flex; flex-direction:column; gap:20px; }
  .diary-item{
    display:grid; grid-template-columns:150px 1fr; gap:18px;
    border:1.5px solid var(--ink); border-radius:3px; padding:16px; cursor:pointer; transition:.15s;
    box-shadow:3px 3px 0 rgba(0,0,0,.4);
  }
  .diary-item:hover{ transform:translate(-1px,-1px); box-shadow:4px 4px 0 rgba(0,0,0,.4); }
  .diary-item .frame{ width:150px; height:150px; border-radius:2px; overflow:hidden; background:#111; flex-shrink:0; filter:sepia(.12); }
  .diary-item img{ width:100%; height:100%; object-fit:cover; display:block; }
  .diary-body{ display:flex; flex-direction:column; justify-content:center; }
  .diary-body .cap-text{ font-family:'MedievalSharp', cursive; font-size:20px; font-weight:400; line-height:1.3; margin:0 0 8px; color:var(--ink); }
  .diary-body .cap-meta{ font-size:11.5px; color:var(--ink-muted); display:flex; gap:14px; flex-wrap:wrap; font-family:'Cinzel',serif; letter-spacing:.03em; }
  .diary-body .cap-meta span{ display:flex; align-items:center; gap:5px; }

  .story{ margin-top:40px; position:relative; padding-left:36px; }
  .story::before{
    content:''; position:absolute; left:13px; top:6px; bottom:6px; width:2px;
    background:repeating-linear-gradient(to bottom, var(--ink-faint) 0 6px, transparent 6px 12px);
  }
  .story-item{ position:relative; margin-bottom:38px; }
  .story-marker{
    position:absolute; left:-36px; top:0; width:30px; height:30px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #d8c085, #8c723e 55%, #3a2c15 100%);
    border:2px solid #1a0d08; display:flex; align-items:center; justify-content:center;
    font-size:13px; z-index:1; box-shadow:0 2px 4px rgba(0,0,0,.5);
  }
  .story-card{
    border:1.5px solid var(--ink); border-radius:3px; padding:14px;
    display:flex; gap:16px; cursor:pointer; box-shadow:3px 3px 0 rgba(0,0,0,.4); transition:.15s;
  }
  .story-card:hover{ transform:translate(-1px,-1px); box-shadow:4px 4px 0 rgba(0,0,0,.4); }
  .story-card .frame{ width:110px; height:110px; border-radius:2px; overflow:hidden; background:#111; flex-shrink:0;
    border:4px solid #f3e6c4; box-shadow:0 4px 10px rgba(0,0,0,.35); filter:sepia(.15); }
  .story-card img{ width:100%; height:100%; object-fit:cover; display:block; }
  .story-date{ font-family:'Cinzel',monospace; font-size:10px; color:var(--ink-faint); margin-bottom:4px; letter-spacing:.04em; }
  .story-text{ font-family:'MedievalSharp', cursive; font-size:19px; font-weight:400; line-height:1.25; color:var(--ink); }
  .story-loc{ font-size:12px; color:var(--ink-muted); margin-top:6px; font-style:italic; }

  @media (max-width:520px){
    .diary-item{ grid-template-columns:1fr; }
    .diary-item .frame{ width:100%; height:200px; }
    .story-card{ flex-direction:column; }
    .story-card .frame{ width:100%; height:180px; }
  }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(10,7,4,.72); backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal{
    border:2px solid var(--ink); border-radius:5px; width:100%;
    max-width:480px; max-height:88vh; overflow-y:auto; box-shadow:8px 8px 0 rgba(0,0,0,.5);
  }
  .modal-head{ padding:22px 24px 0; display:flex; justify-content:space-between; align-items:center; }
  .modal-head h3{ font-family:'MedievalSharp', cursive; font-size:26px; font-weight:400; margin:0; color:var(--ink); }
  .modal-close{ background:none; border:none; color:var(--ink-muted); font-size:22px; line-height:1; padding:4px; }
  .modal-close:hover{ color:var(--ink); }
  .modal-body{ padding:16px 24px 24px; display:flex; flex-direction:column; gap:15px; }

  .field label{ display:block; font-size:12px; color:var(--ink-muted); margin-bottom:6px; font-weight:600; font-family:'Cinzel',serif; letter-spacing:.03em; }
  .field input[type=text], .field input[type=date], .field textarea{
    width:100%; background:rgba(255,255,255,.25); border:1.5px solid var(--border); border-radius:3px;
    padding:9px 11px; color:var(--ink); font-size:14.5px; resize:vertical; font-family:'EB Garamond',serif;
  }
  .field input:focus, .field textarea:focus{ outline:none; border-color:var(--accent); }
  .field textarea{ min-height:60px; }

  .swatches{ display:flex; gap:8px; flex-wrap:wrap; }
  .swatch{ width:26px; height:26px; border-radius:50%; border:2px solid transparent; cursor:pointer; transition:.12s; }
  .swatch.active{ border-color:var(--ink); transform:scale(1.12); }

  .icon-pick{ display:flex; gap:7px; flex-wrap:wrap; }
  .icon-pick button{
    width:36px; height:36px; border-radius:3px; background:rgba(255,255,255,.25); border:1.5px solid var(--border);
    font-size:16px; display:flex; align-items:center; justify-content:center;
  }
  .icon-pick button.active{ border-color:var(--accent); background:var(--accent-soft); }

  .modal-footer{ display:flex; justify-content:flex-end; gap:10px; margin-top:2px; padding:0 24px 24px; }

  .upload-drop{
    border:2px dashed var(--border); border-radius:4px; padding:20px; text-align:center;
    color:var(--ink-muted); font-size:13.5px; cursor:pointer; transition:.15s; display:block; font-style:italic;
  }
  .upload-drop:hover{ border-color:var(--accent); color:var(--ink); }
  .upload-drop.has-img{ padding:0; overflow:hidden; }
  .upload-drop.has-img img{ width:100%; max-height:220px; object-fit:cover; display:block; filter:sepia(.12); }
  .upload-drop input{ display:none; }
  .swap-hint{ font-size:11px; color:var(--ink-faint); margin-top:6px; font-style:italic; }

  .lightbox-backdrop{
    position:fixed; inset:0; background:rgba(8,5,3,.85); display:flex; align-items:center; justify-content:center;
    z-index:110; padding:24px;
  }
  .lightbox{
    background:var(--paper); border-radius:4px; max-width:520px; width:100%; padding:16px 16px 0; position:relative;
    box-shadow:0 24px 60px rgba(0,0,0,.6);
  }
  .lightbox .frame{ width:100%; max-height:58vh; border-radius:2px; overflow:hidden; background:#111; filter:sepia(.12); }
  .lightbox img{ width:100%; height:100%; object-fit:contain; max-height:58vh; display:block; margin:0 auto; background:#0c0c0c; }
  .lightbox-cap{ padding:16px 6px 20px; }
  .lightbox-cap .cap-text{ font-family:'MedievalSharp', cursive; font-size:21px; font-weight:400; color:var(--ink); line-height:1.35; }
  .lightbox-cap .cap-meta{ margin-top:10px; font-size:11px; color:#8a7650; display:flex; gap:14px; flex-wrap:wrap; font-family:'Cinzel',serif; letter-spacing:.03em; }
  .lightbox-actions{ position:absolute; top:-14px; right:-14px; display:flex; gap:6px; }
  .lightbox-close{ position:absolute; top:-14px; left:-14px; }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink);
    color:var(--paper); padding:11px 20px; border-radius:3px; font-size:13px; font-family:'Cinzel',serif; letter-spacing:.03em;
    box-shadow:var(--shadow); z-index:200; opacity:0; pointer-events:none; transition:.25s ease;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  .sync-badge{
    position:absolute; top:0; right:0; font-size:10px; color:#8a7650; padding:4px 8px;
  }
  .online .sync-badge::before{ content:'● '; color:#4f6b3f; }
  .offline .sync-badge::before{ content:'● '; color:#8a6a2f; }

  .hidden{ display:none !important; }
</style>
</head>
<body>

<div class="spine">
  <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
</div>

<div class="app" id="app">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">📜</div>
      <div>
        <h1>Crônicas</h1>
        <p>álbum de memórias com links do Google Drive, sincronizado com Supabase</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-ghost btn-sm" id="btnSync">Sincronizar</button>
      <button class="btn btn-ghost btn-sm" id="btnExport">Exportar backup</button>
      <input type="file" id="importFile" accept="application/json" class="hidden">
    </div>
  </div>
  <div class="sync-badge online" id="syncStatus">● Online</div>

  <div id="view"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0"></script>
<script>
/* ======================= SUPABASE CONFIG ======================= */
const SUPABASE_URL = 'https://cfdzwduajsatbydphrtq.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNmZHp3ZHVhanNhdGJ5ZHBocnRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4MzQ2MDIsImV4cCI6MjA5MzQxMDYwMn0.zUB9rASXCXxKVJFfvXrfcMCivQ3fPV4AE0Jvo4hCamQ';

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ======================= DATA LAYER ======================= */
const STORAGE_KEY = 'cronicas_album_data_v5';

const ACCENTS = ['#8a3324','#4f6b3f','#8a6a2f','#4a5568','#6b4423','#5c4a6b'];
const ICONS = ['🗺️','🏰','⚔️','🕯️','📜','🍂','🐺','⛺','🔥','🌲','🦅','⚜️'];
const MOODS = [
  {v:'', label:'Nenhum'},
  {v:'😊', label:'Feliz'},
  {v:'🥹', label:'Emocionado'},
  {v:'😍', label:'Apaixonado'},
  {v:'😮', label:'Surpreso'},
  {v:'😌', label:'Tranquilo'},
  {v:'😢', label:'Triste'},
  {v:'🎉', label:'Celebrando'},
];

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : { albums: [] };
  }catch(e){ return { albums: [] }; }
}

function saveData(data){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return true;
  }catch(e){
    toast('Armazenamento cheio — exporte um backup e remova fotos antigas.', true);
    return false;
  }
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

let state = loadData();
let currentAlbumId = null;
let userId = localStorage.getItem('cronicas_user_id') || (localStorage.setItem('cronicas_user_id', uid()), localStorage.getItem('cronicas_user_id'));
let isOnline = navigator.onLine;

/* ======================= HELPERS ======================= */
function toast(msg, danger){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = danger ? 'var(--danger)' : 'var(--ink)';
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=> t.classList.remove('show'), 2600);
}

function formatDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  if(!y) return iso;
  return `${d}/${m}/${y}`;
}

function resizeImage(file, maxDim=1400, quality=0.82){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let {width, height} = img;
        if(width > height && width > maxDim){ height = height*(maxDim/width); width = maxDim; }
        else if(height > maxDim){ width = width*(maxDim/height); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function getAlbum(id){ return state.albums.find(a=>a.id===id); }
function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }
function ACENTS_DEFAULT(){ return ACCENTS[Math.floor(Math.random()*ACCENTS.length)]; }

/* ======================= SYNC WITH SUPABASE ======================= */
async function syncAlbums(){
  if(!isOnline){ toast('Offline — usando dados locais', true); return; }
  try{
    const {data, error} = await supabase.from('cronicas_albums_v5').select('*').eq('user_id', userId);
    if(error) throw error;
    state.albums = data || [];
    for(let album of state.albums){
      const {data: photos, error: pError} = await supabase.from('cronicas_photos_v5').select('*').eq('album_id', album.id);
      if(!pError) {
        album.photos = (photos || []).map(p=>({
          id: p.id,
          db_id: p.id,
          googleDriveLink: p.google_drive_link,
          googleDriveFileId: p.google_drive_file_id,
          thumbnailUrl: getGoogleDriveThumbnailUrl(p.google_drive_file_id),
          caption: p.caption,
          location: p.location,
          date: p.photo_date,
          mood: p.mood_emoji,
          addedAt: new Date(p.added_at).getTime()
        }));
      }
    }
    saveData(state);
    renderHome();
    toast('Sincronizado com Supabase');
  }catch(e){
    console.error('Sync error:', e);
    toast('Erro ao sincronizar', true);
  }
}

async function saveAlbumToSupabase(album){
  if(!isOnline){ return; }
  try{
    if(album.db_id){
      await supabase.from('cronicas_albums_v5').update({album_title:album.title,album_description:album.description,album_accent:album.accent,album_icon:album.icon,album_layout:album.layout}).eq('id',album.db_id);
    } else {
      const {data, error} = await supabase.from('cronicas_albums_v5').insert([{user_id:userId,album_title:album.title,album_description:album.description,album_accent:album.accent,album_icon:album.icon,album_layout:album.layout||'grid'}]).select();
      if(error) throw error;
      album.db_id = data[0].id;
    }
  }catch(e){ console.error('Save album error:', e); }
}

async function savePhotoToSupabase(albumId, photo){
  if(!isOnline){ return; }
  try{
    const album = getAlbum(albumId);
    if(!album.db_id) return;
    const {data, error} = await supabase.from('cronicas_photos_v5').insert([{
      album_id: album.db_id,
      google_drive_link: photo.googleDriveLink,
      google_drive_file_id: photo.googleDriveFileId,
      caption: photo.caption,
      location: photo.location,
      photo_date: photo.date,
      mood_emoji: photo.mood||''
    }]).select();
    if(error) throw error;
    photo.db_id = data[0].id;
  }catch(e){ console.error('Save photo error:', e); }
}

function renderPhotos(album){
  const wrap = document.getElementById('photosWrap');
  if(album.photos.length === 0){
    wrap.innerHTML = `
      <div class="empty parchment dogear" style="margin-top:32px;">
        <div class="medieval">O álbum está vazio</div>
        <p>Adicione a primeira foto com uma legenda, local e data para começar a registrar este momento.</p>
      </div>`;
    return;
  }

  if(album.layout === 'story'){
    const asc = album.photos.slice().sort((a,b)=> (a.date||'').localeCompare(b.date||'') || a.addedAt - b.addedAt);
    wrap.innerHTML = `<div class="story">${asc.map(p=>storyItemHtml(p)).join('')}</div>`;
    wrap.querySelectorAll('.story-card').forEach((el,i)=> el.onclick = ()=> openLightbox(album.id, asc[i].id));
    return;
  }

  const sorted = album.photos.slice().sort((a,b)=> (b.date||'').localeCompare(a.date||'') || b.addedAt - a.addedAt);

  if(album.layout === 'diary'){
    wrap.innerHTML = `<div class="diary">${sorted.map(p=>diaryItemHtml(p)).join('')}</div>`;
    wrap.querySelectorAll('.diary-item').forEach(el=> el.classList.add('parchment'));
    wrap.querySelectorAll('.diary-item').forEach((el,i)=> el.onclick = ()=> openLightbox(album.id, sorted[i].id));
  } else {
    wrap.innerHTML = `<div class="photo-grid">${sorted.map(p=>polaroidHtml(p)).join('')}</div>`;
    wrap.querySelectorAll('.polaroid').forEach(el=> el.classList.add('parchment'));
    wrap.querySelectorAll('.polaroid').forEach((el,i)=> el.onclick = ()=> openLightbox(album.id, sorted[i].id));
  }
}

/* ======================= ALBUM MODAL ======================= */
function openAlbumModal(albumId){
  const editing = !!albumId;
  const album = editing ? getAlbum(albumId) : { title:'', description:'', accent: ACENTS_DEFAULT(), icon: ICONS[0] };

  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal parchment">
      <div class="modal-head">
        <h3>${editing ? 'Personalizar álbum' : 'Novo álbum'}</h3>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label>Título</label>
          <input type="text" id="fTitle" placeholder="Ex: Viagem a Ouro Preto" value="${escapeHtml(album.title)}">
        </div>
        <div class="field">
          <label>Descrição (opcional)</label>
          <textarea id="fDesc" placeholder="Um resumo curto sobre esse álbum...">${escapeHtml(album.description)}</textarea>
        </div>
        <div class="field">
          <label>Cor do selo</label>
          <div class="swatches" id="swatches"></div>
        </div>
        <div class="field">
          <label>Ícone</label>
          <div class="icon-pick" id="iconPick"></div>
        </div>
        ${editing ? `<button class="btn btn-danger btn-sm" id="btnDeleteAlbum" style="align-self:flex-start;">Excluir álbum</button>` : ''}
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="btnCancel">Cancelar</button>
        <button class="btn btn-primary" id="btnSaveAlbum">${editing ? 'Salvar' : 'Criar álbum'}</button>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);

  let chosenAccent = album.accent;
  let chosenIcon = album.icon;

  const swWrap = backdrop.querySelector('#swatches');
  ACCENTS.forEach(c=>{
    const s = document.createElement('div');
    s.className = 'swatch' + (c===chosenAccent?' active':'');
    s.style.background = c;
    s.onclick = ()=>{ chosenAccent = c; swWrap.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active')); s.classList.add('active'); };
    swWrap.appendChild(s);
  });

  const icWrap = backdrop.querySelector('#iconPick');
  ICONS.forEach(ic=>{
    const b = document.createElement('button');
    b.textContent = ic;
    b.className = ic===chosenIcon ? 'active' : '';
    b.type = 'button';
    b.onclick = ()=>{ chosenIcon = ic; icWrap.querySelectorAll('button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); };
    icWrap.appendChild(b);
  });

  const close = ()=> backdrop.remove();
  backdrop.querySelector('.modal-close').onclick = close;
  backdrop.querySelector('#btnCancel').onclick = close;
  backdrop.onclick = e=>{ if(e.target === backdrop) close(); };

  if(editing){
    backdrop.querySelector('#btnDeleteAlbum').onclick = ()=>{
      if(confirm(`Excluir o álbum "${album.title}" e todas as suas fotos? Essa ação não pode ser desfeita.`)){
        state.albums = state.albums.filter(a=>a.id!==albumId);
        saveData(state);
        close();
        renderHome();
        toast('Álbum excluído.');
      }
    };
  }

  backdrop.querySelector('#btnSaveAlbum').onclick = ()=>{
    const title = backdrop.querySelector('#fTitle').value.trim();
    if(!title){ toast('Dê um título ao álbum.', true); return; }
    const description = backdrop.querySelector('#fDesc').value.trim();

    if(editing){
      album.title = title; album.description = description; album.accent = chosenAccent; album.icon = chosenIcon;
    } else {
      state.albums.push({
        id: uid(), title, description, accent: chosenAccent, icon: chosenIcon,
        layout: 'grid', createdAt: Date.now(), photos: [], db_id: null
      });
    }
    if(saveData(state)){
      close();
      if(editing){
        saveAlbumToSupabase(album);
        renderAlbum(albumId);
      } else {
        const newAlbum = state.albums[state.albums.length-1];
        saveAlbumToSupabase(newAlbum);
        renderHome();
      }
      toast(editing ? 'Álbum atualizado.' : 'Álbum criado.');
    }
  };
}

/* ======================= HELPERS: GOOGLE DRIVE ======================= */
function extractGoogleDriveFileId(link) {
  const match = link.match(/\/d\/([a-zA-Z0-9-_]+)/);
  return match ? match[1] : null;
}

function getGoogleDriveThumbnailUrl(fileId) {
  return `https://drive.google.com/thumbnail?id=${fileId}&sz=w200`;
}

  const imgSrc = photo.thumbnailUrl || (photo.googleDriveFileId ? getGoogleDriveThumbnailUrl(photo.googleDriveFileId) : photo.dataUrl);
  
  const backdrop = document.createElement('div');
  backdrop.className = 'lightbox-backdrop';

        ${photo.googleDriveLink ? `<button class="icon-btn" id="lbOpen" title="Abrir no Google Drive">🔗</button>` : ''}

  document.body.appendChild(backdrop);
  const close = ()=> backdrop.remove();
  backdrop.querySelector('.lightbox-close').onclick = close;
  backdrop.onclick = e=>{ if(e.target === backdrop) close(); };
  
  if(photo.googleDriveLink){
    const lbOpen = backdrop.querySelector('#lbOpen');

  toast('Backup exportado.');
};

document.getElementById('btnImport').onclick = ()=> document.getElementById('importFile').click();
document.getElementById('importFile').onchange = (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const imported = JSON.parse(reader.result);
      if(!imported.albums) throw new Error('formato inválido');
      state = imported;
      saveData(state);
      renderHome();
      toast('Backup importado.');
    }catch(err){
      toast('Arquivo inválido.', true);
    }
    e.target.value = '';
  };
  reader.readAsText(file);
};

/* ======================= SYNC BUTTON & ONLINE/OFFLINE ======================= */
document.getElementById('btnSync').onclick = syncAlbums;
window.addEventListener('online', ()=>{ isOnline = true; document.getElementById('syncStatus').className = 'sync-badge online'; toast('Conectado!'); });
window.addEventListener('offline', ()=>{ isOnline = false; document.getElementById('syncStatus').className = 'sync-badge offline'; });

/* ======================= INIT ======================= */
renderHome();
</script>

</body>
</html>
